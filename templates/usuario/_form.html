<form action="usuario.php?accion=<?php echo $accion; ?><?php echo isset($datos['id_usuario']) ? '&id=' . $datos['id_usuario'] : ''; ?>" method="post" autocomplete="off">
    <?php if (isset($datos['error'])): ?>
        <div class="alert alert-danger"><?php echo htmlspecialchars($datos['error'], ENT_QUOTES, 'UTF-8'); ?></div>
    <?php endif; ?>
    <div class="mb-3">
        <label class="form-label">Correo</label>
        <input type="email" name="data[correo]" value="<?php echo htmlspecialchars($datos['correo'] ?? '', ENT_QUOTES, 'UTF-8'); ?>" class="form-control" id="correo" autocomplete="off" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Contraseña</label>
        <input type="password" name="data[contrasena]" value="" class="form-control" id="contrasena" autocomplete="new-password">
        <?php if (isset($datos['id_usuario'])): ?>
            <div class="form-text">Déjala vacía para conservar la contraseña actual.</div>
        <?php endif; ?>
    </div>
    <div class="mb-3">
        <label class="form-label">Rol</label>
        <?php foreach ($roles as $rol): ?>
            <div class="form-check">
                <input type="checkbox" name="data[id_rol][]" value="<?php echo $rol['id_rol']; ?>" class="form-check-input" id="rol_<?php echo $rol['id_rol']; ?>" <?php echo in_array($rol['id_rol'], $datos['roles_usuario']) ? 'checked' : ''; ?>>
                <label class="form-check-label" for="rol_<?php echo $rol['id_rol']; ?>">
                    <?php echo htmlspecialchars($rol['rol'], ENT_QUOTES, 'UTF-8'); ?>
                </label>

        <?php endforeach; ?>
