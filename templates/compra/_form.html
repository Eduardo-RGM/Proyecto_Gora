<?php
    require_once __DIR__ . '/../../admin/models/proveedor/proveedor.class.php';
    require_once __DIR__ . '/../../admin/models/empleado/empleado.class.php';
    require_once __DIR__ . '/../../admin/models/material/material.class.php';
    $proveedores = (new proveedor())->getall();
    $empleados = (new empleado())->getall();
    $materiales = (new material())->getall();
?>
<?php if (!empty($errores)): ?>
    <div class="alert alert-danger"><ul class="mb-0"><?php foreach ($errores as $error): ?><li><?php echo htmlspecialchars($error, ENT_QUOTES, 'UTF-8'); ?></li><?php endforeach; ?></ul></div>
<?php endif; ?>
<form action="compra.php?accion=<?php echo $accion; ?><?php echo isset($datos['id_compra']) ? '&id=' . $datos['id_compra'] : ''; ?>" method="post">
    <div class="mb-3">
        <label class="form-label">Proveedor</label>
        <select name="data[id_proveedor]" class="form-select" required>
            <option value="">Selecciona un proveedor</option>
            <?php foreach ($proveedores as $proveedor): ?>
                <option value="<?php echo $proveedor['id_proveedor']; ?>" <?php echo isset($datos['id_proveedor']) && $datos['id_proveedor'] == $proveedor['id_proveedor'] ? 'selected' : ''; ?>><?php echo htmlspecialchars($proveedor['razon_social'], ENT_QUOTES, 'UTF-8'); ?></option>
            <?php endforeach; ?>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Material</label>
        <select name="data[id_material]" class="form-select" required>
            <option value="">Selecciona un material</option>
            <?php foreach ($materiales as $material): ?>
                <option value="<?php echo $material['id_material']; ?>" <?php echo isset($datos['id_material']) && $datos['id_material'] == $material['id_material'] ? 'selected' : ''; ?>><?php echo htmlspecialchars($material['material'], ENT_QUOTES, 'UTF-8'); ?></option>
            <?php endforeach; ?>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Empleado</label>
        <select name="data[id_empleado]" class="form-select" required>
            <option value="">Selecciona un empleado</option>
            <?php foreach ($empleados as $empleado): ?>
                <option value="<?php echo $empleado['id_empleado']; ?>" <?php echo isset($datos['id_empleado']) && $datos['id_empleado'] == $empleado['id_empleado'] ? 'selected' : ''; ?>><?php echo htmlspecialchars($empleado['nombre'], ENT_QUOTES, 'UTF-8'); ?></option>
            <?php endforeach; ?>
        </select>
    </div>
    <div class="mb-3">
        <label class="form-label">Fecha</label>
        <input type="date" name="data[fecha]" value="<?php echo htmlspecialchars($datos['fecha'] ?? '', ENT_QUOTES, 'UTF-8'); ?>" class="form-control" max="<?php echo date('Y-m-d'); ?>" required>
    </div>
    <div class="mb-3">
        <label class="form-label">Cantidad</label>
        <input type="number" name="data[cantidad]" value="<?php echo htmlspecialchars($datos['cantidad'] ?? '', ENT_QUOTES, 'UTF-8'); ?>" class="form-control" min="0.01" max="99999999.99" step="0.01" required>
    </div>
    <input type="submit" class="btn btn-success" name="enviar" value="Guardar">
</form>
