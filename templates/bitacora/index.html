<div class="card module-card">
    <div class="card-body">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="h5 mb-0">Actividad reciente</h2>
            <span class="badge text-bg-secondary"><?php echo count($registros); ?> registros</span>
        </div>
        <?php if (!$registros): ?>
            <div class="alert alert-info mb-0">Todavía no hay actividades registradas.</div>
        <?php else: ?>
            <div class="table-responsive">
                <table class="table table-sm align-middle">
                    <thead>
                        <tr><th>Fecha</th><th>Evento</th><th>Usuario</th><th>Detalle</th><th>IP</th></tr>
                    </thead>
                    <tbody>
                        <?php foreach ($registros as $registro): ?>
                            <tr>
                                <td><?php echo htmlspecialchars($registro['datetime'] ?? '', ENT_QUOTES, 'UTF-8'); ?></td>
                                <td><span class="badge text-bg-primary"><?php echo htmlspecialchars($registro['message'] ?? '', ENT_QUOTES, 'UTF-8'); ?></span></td>
                                <td><?php echo htmlspecialchars($registro['context']['usuario'] ?? '', ENT_QUOTES, 'UTF-8'); ?></td>
                                <td>
                                    <?php
                                        $detalle = $registro['context'] ?? [];
                                        unset($detalle['usuario'], $detalle['id_usuario'], $detalle['ip']);
                                        echo htmlspecialchars(json_encode($detalle, JSON_UNESCAPED_UNICODE), ENT_QUOTES, 'UTF-8');
                                    ?>
                                </td>
                                <td><?php echo htmlspecialchars($registro['context']['ip'] ?? '', ENT_QUOTES, 'UTF-8'); ?></td>
                            </tr>
                        <?php endforeach; ?>
                    </tbody>
                </table>
            </div>
        <?php endif; ?>
    </div>
</div>
