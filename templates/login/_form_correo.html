<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña | GORA</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body class="login-page">
    <main class="login-layout">
        <section class="login-intro" aria-label="Presentación">
            <div class="brand">
                <span class="brand-mark" aria-hidden="true">G</span>
                <span>GORA</span>
            </div>
            <div class="intro-copy">
                <h1>Recupera el acceso a tu espacio.</h1>
                <p>Te ayudaremos a volver a tu cuenta de forma rápida y segura.</p>
            </div>
            <p class="intro-note">Recibirás un enlace temporal en tu correo registrado.</p>
        </section>

        <section class="login-panel" aria-labelledby="recover-email-title">
            <h2 id="recover-email-title">Recuperar contraseña</h2>
            <p>Escribe el correo asociado a tu cuenta para continuar.</p>

            <form method="post" action="login.php?accion=enviar_correo" id="recuperar-correo">
                <div class="field">
                    <label for="correo-recuperacion">Correo electrónico</label>
                    <input
                        type="email"
                        id="correo-recuperacion"
                        name="correo"
                        placeholder="tu@correo.com"
                        autocomplete="email"
                        required>
                </div>

                <input class="submit-button" type="submit" name="enviar" value="Continuar">
            </form>
            <a class="forgot-password" href="login.php?accion=login">Volver al inicio de sesión</a>
        </section>
    </main>
</body>
</html>
